name = "opentrackio-proof"
version = "0.1.0"
defaultTargets = [
  "InverseApproximation", "DistortionConversion", "PrincipalPointConversion",
  "PixelEquivalence", "MutationTests", "MutationTestsY", "DistortionConversionCorrected",
  "PipelineEquivalence", "InverseConjugacy",
  "RationalValueWrappers", "JsonRawModel", "DecodeError", "ProtocolVersion",
  "VersionDecoder", "ProtocolDecoder", "RationalDecoder", "NonemptyArrayDecoder",
  "TimingEnumDecoders", "TransformModel", "TransformDecoder", "CameraModel",
  "CameraDecoder", "LensModel", "LensDecoder", "SampleModel", "SampleDecoder",
  "ErrorCorrectness", "VersionEncoder", "LeafEncoders", "TransformEncoder",
  "GlobalStageEncoder", "TrackerEncoder", "PtpInfoEncoder", "NumericLiteralRoundtrip",
  "LeafDecoders", "GlobalStageDecoder", "TrackerDecoder", "PtpInfoDecoder",
  "TimecodeDecoder", "TimecodeEncoder", "SynchronizationDecoder", "SynchronizationEncoder",
  "TimingDecoder", "TimingEncoder", "CameraEncoder", "LensSubEncoders", "LensEncoder",
  "SampleEncoder", "WellFormedSampleJson", "NormalizationTheorems", "IntegrationSmoke",
  "HarnessAdapter", "HarnessMain",
  "CoordinateTypes", "LensSemantics", "SemanticBridge", "RadialPolynomial",
  "DistortionModel", "DeltaSemantics", "ProjectionModel", "FovModel", "AngleOfView",
  "ShaderCoords", "ExecutableSemanticOracle", "InjectivityModel"
]
# Every `[[lean_lib]]` target declared below MUST appear in this list. A target
# registered but omitted here is silently excluded from plain `lake build` —
# this list previously covered only 4 of 63 targets (see
# audit/ADVERSARIAL_LEAN_AUDIT.md §2.1), meaning `lake build` never type-checked
# most of the repository's headline theorems despite README.md documenting it
# as the verification command. If you add a new `[[lean_lib]]` target, add its
# name here in the same step — do not rely on remembering to do it later.

[[lean_lib]]
name = "InverseApproximation"
srcDir = "inverse_approximation"

[[lean_lib]]
name = "DistortionConversion"
srcDir = "opencv_opentrackio_proofs"

